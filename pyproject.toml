[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-and-dog-classification-comparison"
version = "1.0.0"
description = "Comparative deep learning study and interactive evaluation between Custom CNN from scratch vs Transfer Learning (MobileNetV2) for Cat & Dog image classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kazim Mammadli", email = "183185837+KazimMammadli@users.noreply.github.com"}
]
keywords = [
    "deep-learning",
    "image-classification",
    "computer-vision",
    "convolutional-neural-networks",
    "transfer-learning",
    "mobilenetv2",
    "tensorflow",
    "keras",
    "streamlit"
]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.13.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/KazimMammadli/cat_and_dog_classification_method_comparison"
Repository = "https://github.com/KazimMammadli/cat_and_dog_classification_method_comparison.git"
Issues = "https://github.com/KazimMammadli/cat_and_dog_classification_method_comparison/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
